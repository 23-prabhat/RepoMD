<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">RepoMD system architecture</title>
  <desc id="description">RepoMD has browser and command-line clients backed by a shared Next.js API. The API reads selected files from GitHub, sends structured analysis requests to OpenCode Zen with Groq fallback, and returns results to browser visualizations or local CLI artifacts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050908"/>
      <stop offset="0.55" stop-color="#07110f"/>
      <stop offset="1" stop-color="#0b1714"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102a22"/>
      <stop offset="1" stop-color="#0b1d18"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0c2630"/>
      <stop offset="1" stop-color="#0a1920"/>
    </linearGradient>
    <linearGradient id="amberPanel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#30230c"/>
      <stop offset="1" stop-color="#1d160a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#39ff14"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#00d4ff"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#ffb800"/>
    </marker>
    <style>
      .heading { font: 800 40px Inter, Segoe UI, Arial, sans-serif; fill: #f4fff9; letter-spacing: -1px; }
      .subtitle { font: 500 16px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #83a398; }
      .zone { font: 700 13px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 2px; }
      .cardTitle { font: 700 20px Inter, Segoe UI, Arial, sans-serif; fill: #f4fff9; }
      .cardSub { font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1px; }
      .body { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #b2c9c1; }
      .small { font: 400 12px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #86a49a; }
      .flowLabel { font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .7px; }
      .number { font: 800 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #06100d; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#background)"/>
  <circle cx="1470" cy="80" r="270" fill="#39ff14" opacity="0.025"/>
  <circle cx="95" cy="1040" r="320" fill="#00d4ff" opacity="0.025"/>

  <!-- Header -->
  <g transform="translate(46 36)">
    <rect x="0" y="2" width="54" height="54" rx="14" fill="#0b211b" stroke="#20c997" stroke-width="2"/>
    <path d="M14 27 C14 15 40 15 40 27 V37 C40 46 14 46 14 37 Z" fill="none" stroke="#39ff14" stroke-width="3"/>
    <circle cx="22" cy="31" r="3" fill="#39ff14"/><circle cx="32" cy="31" r="3" fill="#39ff14"/>
    <text x="72" y="35" class="heading">RepoMD system architecture</text>
    <text x="74" y="59" class="subtitle">ONE ANALYSIS ENGINE · TWO PRODUCT INTERFACES · STRUCTURED REPOSITORY INTELLIGENCE</text>
  </g>

  <!-- Trust zones -->
  <rect x="40" y="135" width="350" height="750" rx="24" fill="#07100e" stroke="#24443a" stroke-width="1.5" stroke-dasharray="7 8"/>
  <rect x="420" y="135" width="780" height="750" rx="24" fill="#07100e" stroke="#296b56" stroke-width="1.5"/>
  <rect x="1230" y="135" width="330" height="750" rx="24" fill="#07100e" stroke="#4d4322" stroke-width="1.5" stroke-dasharray="7 8"/>
  <text x="66" y="170" class="zone" fill="#00d4ff">USER SURFACES</text>
  <text x="446" y="170" class="zone" fill="#39ff14">REPOMD SERVER · TRUST BOUNDARY</text>
  <text x="1256" y="170" class="zone" fill="#ffb800">EXTERNAL SERVICES</text>

  <!-- Flow lines behind cards -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 265 H455" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M360 350 H402 V440 H823 V350 H840" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M360 575 H410 V320 H455" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M360 665 H400 V440 H823 V350 H840" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <path d="M620 400 V510" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M675 555 H715" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M905 555 H945" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M1040 600 V660" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M1000 400 V475 H1040 V510" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>

    <path d="M785 250 H805 V188 H1210 V250 H1260" stroke="#ffb800" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M1260 345 H1190 V455 H580 V510" stroke="#ffb800" stroke-width="3" marker-end="url(#arrowAmber)"/>
    <path d="M1135 545 H1210 V560 H1260" stroke="#39ff14" stroke-width="3" marker-end="url(#arrowGreen)"/>
    <path d="M1135 575 H1190 V730 H1260" stroke="#ffb800" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowAmber)"/>

    <path d="M485 710 H405 V770 H360" stroke="#00d4ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M405 710 V410 H360" stroke="#00d4ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- User: browser -->
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="290" height="215" rx="18" fill="url(#bluePanel)" stroke="#16728a"/>
    <rect x="70" y="205" width="290" height="42" rx="18" fill="#0c303a"/>
    <circle cx="94" cy="226" r="4" fill="#ff5f57"/><circle cx="108" cy="226" r="4" fill="#ffb800"/><circle cx="122" cy="226" r="4" fill="#39ff14"/>
    <text x="92" y="280" class="cardSub" fill="#00d4ff">WEB PRODUCT</text>
    <text x="92" y="312" class="cardTitle">Next.js browser UI</text>
    <text x="92" y="342" class="body">Paste a GitHub URL</text>
    <text x="92" y="366" class="body">Stream progress with SSE</text>
    <text x="92" y="390" class="body">Explore 7 analysis modules + PDF</text>
  </g>

  <!-- User: CLI -->
  <g filter="url(#shadow)">
    <rect x="70" y="490" width="290" height="350" rx="18" fill="#091512" stroke="#24755e"/>
    <rect x="70" y="490" width="290" height="44" rx="18" fill="#0d211b"/>
    <text x="92" y="518" class="small" fill="#39ff14">~/your-repository</text>
    <text x="92" y="570" class="cardSub" fill="#39ff14">CLI PRODUCT · NODE.JS</text>
    <text x="92" y="602" class="cardTitle">repomd init</text>
    <text x="92" y="634" class="body">Detects the Git remote</text>
    <text x="92" y="658" class="body">Calls the same server API</text>
    <text x="92" y="682" class="body">Opens repository-specific chat</text>
    <line x1="92" y1="710" x2="338" y2="710" stroke="#24443a"/>
    <text x="92" y="738" class="small" fill="#72e5bd">LOCAL OUTPUTS</text>
    <text x="92" y="765" class="body">.repomd/analysis.json</text>
    <text x="92" y="789" class="body">report.md · architecture.svg</text>
    <text x="92" y="813" class="body">entry-points.svg</text>
  </g>

  <!-- Server APIs -->
  <g filter="url(#shadow)">
    <rect x="455" y="205" width="330" height="195" rx="18" fill="url(#greenPanel)" stroke="#25876b"/>
    <circle cx="490" cy="242" r="16" fill="#39ff14"/><text x="490" y="247" text-anchor="middle" class="number">1</text>
    <text x="520" y="248" class="cardTitle">POST /api/analyze</text>
    <text x="480" y="286" class="body">Validate and normalize GitHub URL</text>
    <text x="480" y="312" class="body">Fetch metadata, tree, selected files</text>
    <text x="480" y="338" class="body">Build bounded repository context</text>
    <text x="480" y="369" class="small" fill="#39ff14">SSE: metadata → tree → files → analyzing → done</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="205" width="325" height="195" rx="18" fill="url(#greenPanel)" stroke="#25876b"/>
    <circle cx="875" cy="242" r="16" fill="#39ff14"/><text x="875" y="247" text-anchor="middle" class="number">2</text>
    <text x="905" y="248" class="cardTitle">POST /api/chat</text>
    <text x="865" y="286" class="body">Receives saved analysis + question</text>
    <text x="865" y="312" class="body">Grounds answers in repository data</text>
    <text x="865" y="338" class="body">Returns a concise JSON reply</text>
    <text x="865" y="369" class="small" fill="#39ff14">No provider keys reach either client</text>
  </g>

  <!-- Analysis pipeline -->
  <rect x="455" y="465" width="710" height="345" rx="20" fill="#081410" stroke="#1f5546"/>
  <text x="480" y="493" class="cardSub" fill="#72e5bd">SHARED ANALYSIS PIPELINE</text>

  <g>
    <rect x="485" y="510" width="190" height="90" rx="14" fill="#10251f" stroke="#275e4e"/>
    <text x="505" y="540" class="cardSub" fill="#39ff14">A · INGEST</text>
    <text x="505" y="567" class="body">Max 35 priority files</text>
    <text x="505" y="586" class="small">≤100 KB each</text>

    <rect x="715" y="510" width="190" height="90" rx="14" fill="#10251f" stroke="#275e4e"/>
    <text x="735" y="540" class="cardSub" fill="#39ff14">B · PROMPT</text>
    <text x="735" y="567" class="body">Tree + source excerpts</text>
    <text x="735" y="586" class="small">Bounded context budget</text>

    <rect x="945" y="510" width="190" height="90" rx="14" fill="#10251f" stroke="#275e4e"/>
    <text x="965" y="540" class="cardSub" fill="#39ff14">C · ROUTE</text>
    <text x="965" y="567" class="body">Primary AI request</text>
    <text x="965" y="586" class="small">Automatic fallback on failure</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="485" y="660" width="650" height="100" rx="16" fill="#0d2620" stroke="#39ff14" stroke-width="1.5"/>
    <text x="510" y="691" class="cardSub" fill="#39ff14">VALIDATED STRUCTURED RESULT</text>
    <text x="510" y="720" class="body">Folder structure · entry points · dependencies · critical files</text>
    <text x="510" y="745" class="body">Execution flow · tech stack · architecture style · key decisions</text>
  </g>

  <!-- External services -->
  <g filter="url(#shadow)">
    <rect x="1260" y="205" width="270" height="175" rx="18" fill="url(#amberPanel)" stroke="#8d6d1d"/>
    <text x="1286" y="242" class="cardSub" fill="#ffb800">SOURCE CONTROL API</text>
    <text x="1286" y="276" class="cardTitle">GitHub REST API</text>
    <text x="1286" y="309" class="body">Repository metadata</text>
    <text x="1286" y="333" class="body">Recursive tree + file content</text>
    <text x="1286" y="357" class="small">Optional read-only token</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="500" width="270" height="120" rx="18" fill="#11271f" stroke="#39ff14"/>
    <text x="1286" y="533" class="cardSub" fill="#39ff14">PRIMARY ENGINE</text>
    <text x="1286" y="565" class="cardTitle">OpenCode Zen</text>
    <text x="1286" y="591" class="body">DeepSeek · JSON schema output</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1260" y="670" width="270" height="120" rx="18" fill="#2b210d" stroke="#ffb800"/>
    <text x="1286" y="703" class="cardSub" fill="#ffb800">FALLBACK ENGINE</text>
    <text x="1286" y="735" class="cardTitle">Groq</text>
    <text x="1286" y="761" class="body">Used when primary is unavailable</text>
  </g>

  <!-- Flow labels -->
  <g>
    <rect x="381" y="244" width="64" height="23" rx="11" fill="#0a1915" stroke="#275e4e"/><text x="413" y="260" text-anchor="middle" class="flowLabel" fill="#39ff14">HTTPS</text>
    <rect x="995" y="176" width="92" height="23" rx="11" fill="#1d1709" stroke="#66521d"/><text x="1041" y="192" text-anchor="middle" class="flowLabel" fill="#ffb800">READ ONLY</text>
    <rect x="1165" y="538" width="77" height="23" rx="11" fill="#0a1915" stroke="#275e4e"/><text x="1203" y="554" text-anchor="middle" class="flowLabel" fill="#39ff14">PRIMARY</text>
    <rect x="1160" y="700" width="82" height="23" rx="11" fill="#1d1709" stroke="#66521d"/><text x="1201" y="716" text-anchor="middle" class="flowLabel" fill="#ffb800">FALLBACK</text>
    <rect x="373" y="738" width="82" height="23" rx="11" fill="#081a20" stroke="#175c6d"/><text x="414" y="754" text-anchor="middle" class="flowLabel" fill="#00d4ff">RESULTS</text>
  </g>

  <!-- Bottom principles -->
  <text x="46" y="934" class="zone" fill="#83a398">CORE ARCHITECTURE RULES</text>
  <g>
    <rect x="40" y="956" width="370" height="104" rx="16" fill="#0a1713" stroke="#24443a"/>
    <text x="64" y="989" class="cardSub" fill="#39ff14">SERVER-SIDE SECRETS</text>
    <text x="64" y="1017" class="body">Provider and GitHub keys remain in environment variables.</text>
    <text x="64" y="1041" class="small">Never shipped to browser or CLI.</text>

    <rect x="430" y="956" width="370" height="104" rx="16" fill="#0a1713" stroke="#24443a"/>
    <text x="454" y="989" class="cardSub" fill="#00d4ff">NO CENTRAL DATABASE</text>
    <text x="454" y="1017" class="body">Web results use sessionStorage; CLI results stay local.</text>
    <text x="454" y="1041" class="small">Repository content is processed in request scope.</text>

    <rect x="820" y="956" width="370" height="104" rx="16" fill="#0a1713" stroke="#24443a"/>
    <text x="844" y="989" class="cardSub" fill="#ffb800">BOUNDED ANALYSIS</text>
    <text x="844" y="1017" class="body">File size, count, excerpts, timeouts, and arrays are capped.</text>
    <text x="844" y="1041" class="small">Controls latency and model context usage.</text>

    <rect x="1210" y="956" width="350" height="104" rx="16" fill="#0a1713" stroke="#24443a"/>
    <text x="1234" y="989" class="cardSub" fill="#ff6b9d">GRACEFUL FAILURE</text>
    <text x="1234" y="1017" class="body">Compact retry, provider fallback, generic client errors.</text>
    <text x="1234" y="1041" class="small">Internal detail stays in server logs.</text>
  </g>
</svg>
